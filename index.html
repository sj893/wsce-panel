<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Building to Living — 경동건설</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #f2f5fb; }

/* ── Hero ── */
.hero {
  background: linear-gradient(135deg, #08183a 0%, #1a4fa0 55%, #08183a 100%);
  padding: 80px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 25% 50%, rgba(91,155,213,.25) 0%, transparent 60%),
    radial-gradient(ellipse at 75% 50%, rgba(76,175,80,.12) 0%, transparent 60%);
}
.hero-inner { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; }
.hero-logo { margin-bottom: 32px; }
.hero-logo img { height: 48px; filter: brightness(0) invert(1); }
.hero-title {
  font-size: clamp(36px, 7vw, 72px); font-weight: 900;
  color: white; font-family: 'Inter', sans-serif;
  letter-spacing: -2px; line-height: 1.05; margin-bottom: 16px;
}
.hero-sub {
  font-size: clamp(14px, 2vw, 18px);
  color: rgba(255,255,255,.65); font-weight: 300; line-height: 1.6;
}

/* ── Main ── */
.main { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }

/* ── 섹션 제목 ── */
.section-label {
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 900;
  color: #1a4fa0;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}
.divider {
  height: 3px;
  background: #1a4fa0;
  width: 100%;
  margin-bottom: 40px;
}

/* ── AI 초기설계 레이아웃 ── */
.ai-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 48px;
  align-items: start;
}
@media(max-width: 640px) {
  .ai-layout { grid-template-columns: 1fr; gap: 32px; }
}

/* 왼쪽: 지도 */
.map-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.map-circle {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: #1a4fa0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  flex-shrink: 0;
}
.map-circle img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: brightness(0) invert(1);
  opacity: 0.9;
}
.map-line {
  width: 2px;
  height: 28px;
  background: #1a4fa0;
}
.map-caption {
  font-size: 15px;
  font-weight: 800;
  color: #1a4fa0;
  text-align: center;
  margin-bottom: 16px;
  letter-spacing: -0.2px;
}
.step-nums {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.step-num {
  width: 34px; height: 34px;
  background: #1a4fa0;
  color: white;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif;
}

/* 오른쪽: ALT 카드들 */
.alt-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.alt-card {
  background: #b0bec5;
  border-radius: 3px;
  padding: 18px 22px;
}
.alt-title {
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 900;
  color: #1a4fa0;
  font-family: 'Inter', sans-serif;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}
.alt-body {
  display: flex;
  gap: 24px;
  align-items: flex-end;
}
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 72px;
  flex-shrink: 0;
}
.bar {
  width: 20px;
  background: white;
  border-radius: 2px 2px 0 0;
  opacity: 0.9;
}
.alt-table { flex: 1; }
.alt-row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 500;
  color: #1a3a6e;
  padding: 2px 0;
  gap: 12px;
}
.alt-row .val {
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
}
.alt-dots {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}
.alt-dot {
  width: 7px; height: 7px;
  background: #1a4fa0;
  border-radius: 50%;
}
</style>
</head>
